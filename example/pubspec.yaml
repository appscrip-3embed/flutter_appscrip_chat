name: chat_component_example
description: Demonstrates how to use the appscrip_chat_component plugin.

publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=2.19.1 <3.0.0"

dependencies:
  appscrip_chat_component:
    path: ../
  cupertino_icons: ^1.0.8
  email_validator: ^3.0.0
  file_picker: ^8.1.7
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  get: ^4.6.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.2
  image_cropper: ^8.1.0
  image_picker: ^1.1.2
  notification_permissions: ^0.6.1
  path_provider: ^2.1.5
  visibility_detector: ^0.4.0+2

dependency_overrides:
  http: ^1.2.2
  intl: ^0.20.1
  meta: ^1.16.0
  path: ^1.9.1
  syncfusion_flutter_core: ^28.1.39

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
