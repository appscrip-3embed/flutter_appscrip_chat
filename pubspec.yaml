name: appscrip_chat_component
description: A new Flutter plugin project.
version: 1.0.0
publish_to: none
homepage: https://github.com/appscrip-3embed/flutter_appscrip_chat.git

environment:
  sdk: ">=2.19.1 <3.0.0"
  flutter: ">=2.5.0"

dependencies:
  any_link_preview: ^3.0.2
  azlistview: ^2.0.0
  cached_network_image: ^3.4.1
