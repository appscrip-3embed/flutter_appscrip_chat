  flutter:
    sdk: flutter
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^18.0.1
  flutter_screenutil: ^5.9.3
  flutter_slidable: ^3.1.2
  flutter_svg: ^2.0.17
  flutter_web_plugins:
    sdk: flutter
  fluttertoast: ^8.2.10
  geocode: ^1.0.3
  geocoding: ^3.0.0
  geolocator: ^13.0.2
  get: ^4.6.6
  google_maps_flutter: ^2.10.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.2
  image: ^4.5.2
  image_cropper: ^8.1.0
  image_gallery_saver: ^2.0.3
  image_painter: ^0.7.1
  image_picker: ^1.1.2
  intl: ^0.20.1
  link_preview_generator: ^1.2.0
  mqtt_client: ^10.6.4
  open_filex: ^4.6.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  photo_view: ^0.15.0
  plugin_platform_interface: ^2.1.8
  pull_to_refresh: ^2.0.0
  record: ^5.2.0
  scroll_to_index: ^3.0.1
  share_plus: ^10.1.4
  swipe_to: ^1.0.6
  syncfusion_flutter_pdfviewer: ^28.1.39
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  video_compress: ^3.1.3
  video_player: ^2.9.2
  video_trimmer: ^4.0.2
  visibility_detector: ^0.4.0+2
  voice_message_package: ^2.2.1
  wechat_assets_picker: ^9.4.2

dependency_overrides:
  http: ^1.2.2
  intl: ^0.20.1
  meta: ^1.16.0
  path: ^1.9.1
  syncfusion_flutter_core: ^28.1.39

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.example.appscrip_chat_component
        pluginClass: ChatComponentPlugin
      ios:
        pluginClass: ChatComponentPlugin
      web:
        pluginClass: ChatComponentWeb
        fileName: appscrip_chat_component_web.dart

  uses-material-design: true
  assets:
    - assets/
    - assets/svg/
    - assets/images/
    - assets/background_images/
